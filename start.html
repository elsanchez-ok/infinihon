<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfiniHon - Cargando</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #020617;
            --accent: #3b82f6;
            --accent-secondary: #06b6d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-deep);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fondo sutil con gradiente radial */
        .bg-ambient {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 30% 70%, rgba(6, 182, 212, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Partículas minimalistas */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 6s ease-in infinite;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.2;
            }
            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1);
            }
        }

        /* Contenedor principal */
        .loader-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            padding: 2rem;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================
           ESPACIO PARA EL LOGO (IMAGEN)
           ========================================== */
        .logo-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Anillo giratorio sutil alrededor del logo */
        .logo-ring {
            position: absolute;
            inset: -8px;
            border-radius: 28% 72% 72% 28% / 28% 28% 72% 72%;
            border: 2px solid transparent;
            border-top-color: rgba(59, 130, 246, 0.4);
            border-right-color: rgba(6, 182, 212, 0.3);
            animation: morphRotate 8s linear infinite;
        }

        .logo-ring:nth-child(2) {
            inset: -16px;
            border-top-color: rgba(6, 182, 212, 0.3);
            border-left-color: rgba(59, 130, 246, 0.3);
            animation-direction: reverse;
            animation-duration: 12s;
        }

        @keyframes morphRotate {
            0% {
                transform: rotate(0deg);
                border-radius: 28% 72% 72% 28% / 28% 28% 72% 72%;
            }
            25% {
                border-radius: 72% 28% 28% 72% / 72% 72% 28% 28%;
            }
            50% {
                transform: rotate(180deg);
                border-radius: 28% 72% 72% 28% / 28% 28% 72% 72%;
            }
            75% {
                border-radius: 72% 28% 28% 72% / 72% 72% 28% 28%;
            }
            100% {
                transform: rotate(360deg);
                border-radius: 28% 72% 72% 28% / 28% 28% 72% 72%;
            }
        }

        /* Glow detrás del logo */
        .logo-glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.8;
            }
        }

        /* Imagen del logo - AQUÍ PONES TU LOGO */
        .logo-image {
            position: relative;
            z-index: 5;
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.5));
            animation: logoFloat 6s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* Placeholder si no hay imagen */
        .logo-placeholder {
            position: relative;
            z-index: 5;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.2));
            border: 2px solid rgba(59, 130, 246, 0.4);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
            animation: logoFloat 6s ease-in-out infinite;
        }

        /* Nombre de la marca */
        .brand-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: 0.05em;
        }

        .brand-name .accent {
            color: var(--accent);
            font-weight: 800;
        }

        /* Tagline */
        .tagline {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #64748b;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* Barra de progreso minimalista */
        .progress-wrapper {
            width: 280px;
            max-width: 80vw;
        }

        .progress-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
            transition: width 0.15s linear;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #475569;
        }

        /* Mensaje de estado */
        .status-message {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            animation: statusBlink 1.5s ease-in-out infinite;
        }

        @keyframes statusBlink {
            0%, 100% {
                opacity: 0.3;
                box-shadow: 0 0 4px rgba(59, 130, 246, 0.3);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            }
        }

        /* ==========================================
           PANTALLA DE BIENVENIDA FINAL
           ========================================== */
        .welcome-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .welcome-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .welcome-content {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .welcome-overlay.active .welcome-content {
            opacity: 1;
            transform: translateY(0);
        }

        /* Saludo dinámico */
        .greeting {
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s ease 0.2s;
        }

        .welcome-overlay.active .greeting {
            opacity: 1;
            transform: translateY(0);
        }

        /* Logo grande final */
        .welcome-logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin: 0 auto 2rem;
            filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.6));
            animation: welcomeFloat 4s ease-in-out infinite;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }

        .welcome-overlay.active .welcome-logo {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes welcomeFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        /* Placeholder del logo en welcome */
        .welcome-logo-placeholder {
            width: 140px;
            height: 140px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(6, 182, 212, 0.3));
            border: 2px solid rgba(59, 130, 246, 0.5);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 0 40px rgba(59, 130, 246, 0.6);
            animation: welcomeFloat 4s ease-in-out infinite;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }

        .welcome-overlay.active .welcome-logo-placeholder {
            opacity: 1;
            transform: scale(1);
        }

        /* Título de bienvenida */
        .welcome-title {
            font-size: 3.5rem;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s ease 0.5s;
        }

        .welcome-overlay.active .welcome-title {
            opacity: 1;
            transform: translateY(0);
        }

        .welcome-title .accent {
            color: var(--accent);
        }

        /* Mensaje de bienvenida */
        .welcome-message {
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s ease 0.6s;
        }

        .welcome-overlay.active .welcome-message {
            opacity: 1;
            transform: translateY(0);
        }

        /* Badge de redirección */
        .redirect-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.5rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 0.1em;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s ease 0.8s;
        }

        .welcome-overlay.active .redirect-badge {
            opacity: 1;
            transform: translateY(0);
        }

        .redirect-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: statusBlink 1.5s ease-in-out infinite;
        }

        /* Transición de salida del loader */
        .loader-container.fade-out {
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>

    <!-- Fondo ambiental -->
    <div class="bg-ambient"></div>

    <!-- Partículas -->
    <div class="particles" id="particles"></div>

    <!-- Contenedor principal del loader -->
    <div class="loader-container" id="loaderContainer">
        
        <!-- ==========================================
             ESPACIO PARA EL LOGO (IMAGEN)
             Cambia el src por la ruta de tu logo
             ========================================== -->
        <div class="logo-container">
            <!-- Anillos decorativos -->
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            
            <!-- Glow detrás -->
            <div class="logo-glow"></div>
            
            <!-- LOGO COMO IMAGEN - Cambia el src -->
            <img 
                src="assets/logo.png" 
                alt="InfiniHon Logo" 
                class="logo-image"
                id="logoImage"
                onerror="this.style.display='none'; document.getElementById('logoPlaceholder').style.display='flex';"
            >
            
            <!-- Placeholder (se muestra si no hay imagen) -->
            <div 
                class="logo-placeholder" 
                id="logoPlaceholder" 
                style="display: none;"
            >
                I
            </div>
        </div>

        <!-- Nombre de la marca -->
        <h1 class="brand-name">
            Infini<span class="accent">Hon</span>
        </h1>

        <!-- Tagline -->
        <p class="tagline">Infraestructura de Grado Industrial</p>

        <!-- Barra de progreso -->
        <div class="progress-wrapper">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span>INICIALIZANDO</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <!-- Mensaje de estado -->
        <div class="status-message">
            <span class="status-dot"></span>
            <span id="statusText">Preparando sistemas...</span>
        </div>
    </div>

    <!-- ==========================================
         PANTALLA DE BIENVENIDA FINAL
         ========================================== -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="welcome-content">
            
            <!-- Saludo dinámico según hora -->
            <p class="greeting" id="greetingText">BUENOS DÍAS</p>
            
            <!-- Logo grande -->
            <img 
                src="assets/logo.png" 
                alt="InfiniHon Logo" 
                class="welcome-logo"
                id="welcomeLogo"
                onerror="this.style.display='none'; document.getElementById('welcomeLogoPlaceholder').style.display='flex';"
            >
            <div 
                class="welcome-logo-placeholder" 
                id="welcomeLogoPlaceholder" 
                style="display: none;"
            >
                I
            </div>
            
            <!-- Título -->
            <h2 class="welcome-title">
                Infini<span class="accent">Hon</span>
            </h2>
            
            <!-- Mensaje de bienvenida profesional -->
            <p class="welcome-message" id="welcomeMessage">
                Bienvenido a la infraestructura del futuro
            </p>
            
            <!-- Badge de redirección -->
            <div class="redirect-badge">
                <span class="redirect-dot"></span>
                REDIRIGIENDO A LA PLATAFORMA
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // DETECTAR HORA DEL DÍA PARA EL SALUDO
        // ==========================================
        function obtenerSaludo() {
            const hora = new Date().getHours();
            
            if (hora >= 5 && hora < 12) {
                return {
                    saludo: 'BUENOS DÍAS',
                    mensaje: 'Bienvenido a la infraestructura del futuro'
                };
            } else if (hora >= 12 && hora < 17) {
                return {
                    saludo: 'BUENAS TARDES',
                    mensaje: 'Bienvenido a la infraestructura del futuro'
                };
            } else if (hora >= 17 && hora < 21) {
                return {
                    saludo: 'BUENAS TARDES',
                    mensaje: 'Bienvenido a la infraestructura del futuro'
                };
            } else {
                return {
                    saludo: 'BUENAS NOCHES',
                    mensaje: 'Bienvenido a la infraestructura del futuro'
                };
            }
        }

        // ==========================================
        // CREAR PARTÍCULAS
        // ==========================================
        function createParticles() {
            const container = document.getElementById('particles');
            const count = 25;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                container.appendChild(particle);
            }
        }

        // ==========================================
        // MENSAJES DE ESTADO
        // ==========================================
        const statusMessages = [
            'Preparando sistemas...',
            'Inicializando núcleos...',
            'Cargando módulos de red...',
            'Verificando integridad...',
            'Optimizando rendimiento...',
            'Estableciendo conexiones seguras...',
            'Calibrando potencia industrial...',
            'Sistemas listos. Bienvenido.'
        ];

        // ==========================================
        // ELEMENTOS
        // ==========================================
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const statusText = document.getElementById('statusText');
        const loaderContainer = document.getElementById('loaderContainer');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const greetingText = document.getElementById('greetingText');
        const welcomeMessage = document.getElementById('welcomeMessage');

        let progress = 0;

        // ==========================================
        // SIMULAR CARGA
        // ==========================================
        function updateLoading() {
            if (progress < 100) {
                // Incremento variable para simular carga real
                const increment = Math.random() * 2.5 + 0.5;
                progress = Math.min(progress + increment, 100);

                // Actualizar barra
                progressFill.style.width = progress + '%';
                progressPercent.textContent = Math.floor(progress) + '%';

                // Actualizar mensaje de estado
                const messageIndex = Math.floor((progress / 100) * (statusMessages.length - 1));
                statusText.textContent = statusMessages[messageIndex];

                // Continuar carga
                const delay = progress > 90 ? Math.random() * 200 + 100 : Math.random() * 80 + 30;
                setTimeout(updateLoading, delay);
            } else {
                // Carga completada
                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';
                statusText.textContent = 'Sistemas listos.';

                // Transición: ocultar loader
                setTimeout(() => {
                    loaderContainer.classList.add('fade-out');
                }, 400);

                // Mostrar pantalla de bienvenida
                setTimeout(() => {
                    // Configurar saludo según hora
                    const saludo = obtenerSaludo();
                    greetingText.textContent = saludo.saludo;
                    welcomeMessage.textContent = saludo.mensaje;

                    // Activar overlay
                    welcomeOverlay.classList.add('active');

                    // Redirigir después de mostrar el mensaje
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3500);
                }, 800);
            }
        }

        // ==========================================
        // INICIAR
        // ==========================================
        window.addEventListener('load', () => {
            createParticles();
            // Pequeña pausa antes de empezar la carga
            setTimeout(updateLoading, 400);
        });
    </script>
</body>
</html>
