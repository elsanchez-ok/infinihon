<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfiniHon — Cargando</title>
    
    <!-- Mismas fuentes que index.html -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ─── RESET & TOKENS (MISMOS QUE INDEX.HTML) ───────────────────────── */
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        :root{
            --bg:       #050508;
            --bg2:      #08080f;
            --bg3:      #0d0d18;
            --card:     #0f0f1a;
            --card2:    #12121f;
            --border:   rgba(255,255,255,0.07);
            --border2:  rgba(255,255,255,0.12);
            --blue:     #2563eb;
            --blue2:    #1d4ed8;
            --blue-glow:rgba(37,99,235,0.35);
            --cyan:     #38bdf8;
            --white:    #ffffff;
            --gray:     #6b7280;
            --gray2:    #9ca3af;
            --text:     #d1d5db;
            --green:    #22c55e;
            --radius:   10px;
            --radius-lg:18px;
        }

        html{scroll-behavior:smooth;font-size:16px;}
        body{
            font-family:'DM Sans',sans-serif;
            background:var(--bg);color:var(--text);
            overflow:hidden;line-height:1.6;
            height:100vh;width:100vw;
            display:flex;align-items:center;justify-content:center;
        }

        /* ─── FONDO AMBIENTAL CON GRID (COMO HERO) ───────────────────────── */
        .bg-ambient{
            position:fixed;inset:0;pointer-events:none;z-index:0;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
            background-size:60px 60px;
            mask-image:radial-gradient(ellipse at center,black 40%,transparent 85%);
        }

        /* ─── ORB CENTRAL ANIMADO (COMO HERO) ───────────────────────────── */
        .loader-orb{
            position:fixed;top:50%;left:50%;
            transform:translate(-50%,-50%);
            width:min(500px,90vw);height:min(500px,90vw);
            border-radius:50%;
            background:radial-gradient(circle,rgba(37,99,235,.25) 0%,rgba(37,99,235,.08) 40%,transparent 75%);
            pointer-events:none;z-index:1;
            animation:orbPulse 6s ease-in-out infinite;
        }
        @keyframes orbPulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.12);}}

        /* ─── PARTÍCULAS SUTILES ────────────────────────────────────────── */
        .particles{position:fixed;inset:0;pointer-events:none;z-index:2;}
        .particle{
            position:absolute;width:2px;height:2px;
            background:var(--blue);border-radius:50%;
            opacity:0;animation:floatUp 6s ease-in infinite;
        }
        @keyframes floatUp{
            0%{opacity:0;transform:translateY(100vh) scale(0);}
            10%{opacity:0.7;}
            90%{opacity:0.15;}
            100%{opacity:0;transform:translateY(-10vh) scale(1);}
        }

        /* ─── CONTENEDOR PRINCIPAL ──────────────────────────────────────── */
        .loader-container{
            position:relative;z-index:10;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:2rem;padding:2rem;
            transition:all 0.6s cubic-bezier(0.4,0,0.2,1);
            text-align:center;
        }

        /* ─── LOGO CON GLOW Y ANIMACIÓN ─────────────────────────────────── */
        .logo-wrapper{
            position:relative;
            width:clamp(100px,18vw,140px);
            height:clamp(100px,18vw,140px);
            display:flex;align-items:center;justify-content:center;
            margin-bottom:0.5rem;
        }

        .logo-glow{
            position:absolute;inset:0;
            background:radial-gradient(circle,rgba(37,99,235,.4) 0%,transparent 70%);
            border-radius:50%;filter:blur(25px);
            animation:glowPulse 3s ease-in-out infinite;
        }
        @keyframes glowPulse{0%,100%{transform:scale(0.9);opacity:0.5;}50%{transform:scale(1.2);opacity:0.9;}}

        .logo-orb{
            position:relative;z-index:2;
            width:100%;height:100%;
            border-radius:50%;
            background:linear-gradient(135deg,#1d3a8a,var(--blue),#60a5fa);
            display:flex;align-items:center;justify-content:center;
            font-size:clamp(2.5rem,5vw,4rem);
            color:#fff;
            box-shadow:0 0 40px rgba(37,99,235,.6),0 0 80px rgba(37,99,235,.25);
            animation:orbSpin 8s linear infinite;
        }
        @keyframes orbSpin{
            from{box-shadow:0 0 40px rgba(37,99,235,.6),0 0 80px rgba(37,99,235,.25);}
            50%{box-shadow:0 0 60px rgba(96,165,250,.7),0 0 100px rgba(37,99,235,.35);}
            to{box-shadow:0 0 40px rgba(37,99,235,.6),0 0 80px rgba(37,99,235,.25);}
        }

        .logo-image{
            position:absolute;z-index:3;
            width:85%;height:85%;
            object-fit:contain;
            filter:drop-shadow(0 0 25px rgba(37,99,235,.5));
            animation:logoFloat 5s ease-in-out infinite;
        }
        @keyframes logoFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

        .logo-placeholder{
            position:absolute;z-index:3;
            width:85%;height:85%;
            background:linear-gradient(135deg,#1d3a8a,var(--blue));
            border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            font-family:'Syne',sans-serif;font-weight:800;
            font-size:clamp(2rem,4vw,3rem);color:#fff;
            animation:logoFloat 5s ease-in-out infinite;
        }

        /* ─── TEXTO DE MARCA ───────────────────────────────────────────── */
        .brand-name{
            font-family:'Syne',sans-serif;
            font-size:clamp(1.8rem,4vw,2.8rem);
            font-weight:800;color:var(--white);
            letter-spacing:-2px;margin-bottom:0.25rem;
        }
        .brand-name .accent{
            background:linear-gradient(135deg,var(--blue),var(--cyan));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;
        }

        .tagline{
            font-size:clamp(0.7rem,1.5vw,0.85rem);
            color:var(--gray);letter-spacing:0.3em;
            text-transform:uppercase;font-weight:500;
        }

        /* ─── BARRA DE PROGRESO (ESTILO INDEX.HTML) ────────────────────── */
        .progress-wrapper{
            width:clamp(200px,60vw,320px);
            margin-top:1.5rem;
        }
        .progress-track{
            width:100%;height:2px;
            background:var(--border);
            border-radius:2px;overflow:hidden;
        }
        .progress-fill{
            height:100%;width:0%;
            background:linear-gradient(90deg,var(--blue),var(--cyan));
            border-radius:2px;
            box-shadow:0 0 15px var(--blue-glow);
            transition:width 0.15s linear;
        }
        .progress-info{
            display:flex;justify-content:space-between;align-items:center;
            margin-top:0.75rem;font-size:0.7rem;
        }
        .progress-label{color:var(--gray);font-weight:500;}
        .progress-percent{
            font-family:'Syne',sans-serif;font-weight:700;
            color:var(--blue);font-size:0.8rem;
        }

        /* ─── MENSAJE DE ESTADO ───────────────────────────────────────── */
        .status{
            display:flex;align-items:center;gap:0.6rem;
            margin-top:1rem;font-size:0.75rem;color:var(--gray);
        }
        .status-dot{
            width:6px;height:6px;border-radius:50%;
            background:var(--green);
            animation:blink 2s infinite;
        }
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

        /* ─── OVERLAY DE BIENVENIDA ───────────────────────────────────── */
        .welcome-overlay{
            position:fixed;inset:0;
            background:var(--bg);z-index:100;
            display:flex;align-items:center;justify-content:center;
            opacity:0;pointer-events:none;
            transition:opacity 0.6s ease;
        }
        .welcome-overlay.active{opacity:1;pointer-events:auto;}

        .welcome-content{
            text-align:center;
            opacity:0;transform:translateY(24px);
            transition:all 0.6s cubic-bezier(0.34,1.56,0.64,1);
            padding:2rem;
        }
        .welcome-overlay.active .welcome-content{
            opacity:1;transform:translateY(0);
        }

        .welcome-greeting{
            font-size:0.75rem;color:var(--gray);
            letter-spacing:0.3em;text-transform:uppercase;
            margin-bottom:1.5rem;font-weight:500;
        }

        .welcome-logo-orb{
            width:clamp(120px,22vw,160px);
            height:clamp(120px,22vw,160px);
            border-radius:50%;
            background:linear-gradient(135deg,#1d3a8a,var(--blue),#60a5fa);
            display:flex;align-items:center;justify-content:center;
            font-size:clamp(3rem,6vw,5rem);
            color:#fff;
            margin:0 auto 1.5rem;
            box-shadow:0 0 50px rgba(37,99,235,.6),0 0 100px rgba(37,99,235,.3);
            animation:orbSpin 8s linear infinite,logoFloat 5s ease-in-out infinite;
        }

        .welcome-title{
            font-family:'Syne',sans-serif;
            font-size:clamp(2.5rem,6vw,4rem);
            font-weight:800;color:var(--white);
            letter-spacing:-3px;line-height:0.95;
            margin-bottom:0.75rem;
        }
        .welcome-title .accent{
            background:linear-gradient(135deg,var(--blue),var(--cyan));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;
        }

        .welcome-message{
            font-size:clamp(0.9rem,2vw,1.1rem);
            color:var(--gray2);line-height:1.7;
            margin-bottom:2rem;max-width:400px;
        }

        .welcome-badge{
            display:inline-flex;align-items:center;gap:8px;
            background:rgba(255,255,255,0.05);
            border:1px solid var(--border2);
            border-radius:40px;padding:8px 20px;
            font-size:0.75rem;color:var(--gray2);
        }
        .welcome-badge .dot{
            width:5px;height:5px;border-radius:50%;
            background:var(--green);animation:blink 2s infinite;
        }

        /* ─── BOTÓN DE ACCESO RÁPIDO ──────────────────────────────────── */
        .skip-btn{
            position:fixed;bottom:clamp(20px,4vh,40px);right:clamp(20px,4vw,40px);
            padding:8px 16px;border-radius:40px;
            font-size:0.7rem;font-weight:600;
            background:rgba(255,255,255,0.06);
            border:1px solid var(--border2);
            color:var(--gray2);cursor:pointer;
            transition:all 0.25s;z-index:50;
            display:flex;align-items:center;gap:6px;
        }
        .skip-btn:hover{
            background:rgba(255,255,255,0.1);
            border-color:var(--border2);color:var(--white);
        }

        /* ─── TRANSICIÓN DE SALIDA ────────────────────────────────────── */
        .loader-container.fade-out{
            opacity:0;transform:scale(0.98);
            transition:all 0.5s cubic-bezier(0.4,0,0.2,1);
        }

        /* ─── RESPONSIVE ─────────────────────────────────────────────── */
        @media(max-width:540px){
            .loader-container{gap:1.5rem;}
            .progress-info{flex-direction:column;gap:0.25rem;align-items:center;}
        }
    </style>
</head>
<body>

    <!-- Fondo con grid -->
    <div class="bg-ambient"></div>
    <!-- Orb de fondo -->
    <div class="loader-orb"></div>
    <!-- Partículas -->
    <div class="particles" id="particles"></div>

    <!-- Contenedor del loader -->
    <div class="loader-container" id="loaderContainer">
        <div class="logo-wrapper">
            <div class="logo-glow"></div>
            <div class="logo-orb"><i class="fa fa-cube"></i></div>
            <img src="assets/logo.png" alt="InfiniHon" class="logo-image" id="logoImage"
                onerror="this.style.display='none'; document.getElementById('logoPlaceholder').style.display='flex';">
            <div class="logo-placeholder" id="logoPlaceholder" style="display:none;">I</div>
        </div>
        <h1 class="brand-name">Infini<span class="accent">Hon</span></h1>
        <p class="tagline">Digital Agency</p>
        <div class="progress-wrapper">
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-info">
                <span class="progress-label">Cargando experiencia</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
        </div>
        <div class="status">
            <span class="status-dot"></span>
            <span id="statusText">Inicializando...</span>
        </div>
    </div>

    <!-- Overlay de bienvenida -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="welcome-content">
            <p class="welcome-greeting" id="greetingText">Bienvenido</p>
            <div class="welcome-logo-orb"><i class="fa fa-cube"></i></div>
            <h2 class="welcome-title">Infini<span class="accent">Hon</span></h2>
            <p class="welcome-message" id="welcomeMessage">
                Elevando el valor de tu negocio mediante diseño y desarrollo digital de impacto.
            </p>
            <div class="welcome-badge">
                <span class="dot"></span>
                Redirigiendo a la plataforma
            </div>
        </div>
    </div>

    <!-- Botón para saltar carga -->
    <button class="skip-btn" id="skipBtn" onclick="skipLoading()">
        <i class="fa fa-fast-forward"></i> Saltar
    </button>

    <script>
        // ─── VARIABLES ─────────────────────────────────────────────────
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const statusText = document.getElementById('statusText');
        const loaderContainer = document.getElementById('loaderContainer');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const greetingText = document.getElementById('greetingText');
        const welcomeMessage = document.getElementById('welcomeMessage');

        let progress = 0;
        let loadingComplete = false;

        // ─── OBTENER PÁGINA DE ORIGEN (para redirigir correctamente) ───
        function getRedirectUrl(){
            // Busca el parámetro ?return= en la URL
            const params = new URLSearchParams(window.location.search);
            const returnUrl = params.get('return');
            
            // Si existe y es una página válida del sitio, redirigir allí
            if(returnUrl && /^[\w\-\/\.]+$/.test(returnUrl)){
                return returnUrl;
            }
            // Por defecto, ir al index
            return 'index.html';
        }

        // ─── SALUDO SEGÚN HORA ─────────────────────────────────────────
        function getGreeting(){
            const h = new Date().getHours();
            if(h >= 5 && h < 12) return {greet: 'Buenos días', msg: 'Elevando el valor de tu negocio mediante diseño y desarrollo digital de impacto.'};
            if(h >= 12 && h < 18) return {greet: 'Buenas tardes', msg: 'Elevando el valor de tu negocio mediante diseño y desarrollo digital de impacto.'};
            return {greet: 'Buenas noches', msg: 'Elevando el valor de tu negocio mediante diseño y desarrollo digital de impacto.'};
        }

        // ─── PARTÍCULAS ────────────────────────────────────────────────
        function createParticles(){
            const container = document.getElementById('particles');
            for(let i=0; i<30; i++){
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random()*100+'%';
                p.style.animationDelay = Math.random()*6+'s';
                p.style.animationDuration = (Math.random()*4+4)+'s';
                container.appendChild(p);
            }
        }

        // ─── MENSAJES DE ESTADO ────────────────────────────────────────
        const statusMessages = [
            'Inicializando...',
            'Cargando recursos...',
            'Preparando interfaz...',
            'Optimizando experiencia...',
            'Conectando servicios...',
            'Listo para comenzar'
        ];

        // ─── ACTUALIZAR CARGA ──────────────────────────────────────────
        function updateLoading(){
            if(progress < 100 && !loadingComplete){
                const inc = Math.random()*3 + 0.8;
                progress = Math.min(progress + inc, 100);
                
                progressFill.style.width = progress+'%';
                progressPercent.textContent = Math.floor(progress)+'%';
                
                const idx = Math.floor((progress/100)*(statusMessages.length-1));
                statusText.textContent = statusMessages[idx];
                
                const delay = progress > 90 ? 150+Math.random()*100 : 40+Math.random()*50;
                setTimeout(updateLoading, delay);
            }
            else if(!loadingComplete){
                loadingComplete = true;
                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';
                statusText.textContent = 'Listo.';
                
                setTimeout(() => { loaderContainer.classList.add('fade-out'); }, 300);
                
                setTimeout(() => {
                    const g = getGreeting();
                    greetingText.textContent = g.greet;
                    welcomeMessage.textContent = g.msg;
                    welcomeOverlay.classList.add('active');
                    
                    // Redirigir al origen o al index por defecto
                    setTimeout(() => {
                        window.location.href = getRedirectUrl();
                    }, 2800);
                }, 700);
            }
        }

        // ─── SALTAR CARGA ──────────────────────────────────────────────
        function skipLoading(){
            if(loadingComplete) return;
            loadingComplete = true;
            
            progressFill.style.width = '100%';
            progressPercent.textContent = '100%';
            statusText.textContent = 'Listo.';
            
            loaderContainer.classList.add('fade-out');
            
            setTimeout(() => {
                const g = getGreeting();
                greetingText.textContent = g.greet;
                welcomeMessage.textContent = g.msg;
                welcomeOverlay.classList.add('active');
                
                setTimeout(() => {
                    window.location.href = getRedirectUrl();
                }, 1500);
            }, 400);
        }

        // ─── INICIAR ───────────────────────────────────────────────────
        window.addEventListener('load', () => {
            createParticles();
            setTimeout(updateLoading, 500);
        });

        // Permitir saltar con tecla ESC
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') skipLoading();
        });
    </script>
</body>
</html>
