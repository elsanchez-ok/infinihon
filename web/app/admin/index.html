<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("infinihon-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InfiniHon Corp. — tecnología e infraestructura para construir lo que sigue." />
    <meta name="theme-color" content="#05070A" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <title>InfiniHon Corp. — Tecnología e infraestructura</title>
    <style>@font-face{font-family:"Manrope";font-style:normal;font-weight:300 800;font-display:swap;src:url("/fonts/manrope-latin.woff2") format("woff2")}@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400 500;font-display:swap;src:url("/fonts/jbmono-latin.woff2") format("woff2")}</style>
  </head>

    <!-- Respaldo en texto plano para navegadores/bots sin JavaScript. -->

      <main style="max-width:860px;margin:0 auto;padding:2.5rem 1.25rem;font-family:system-ui,sans-serif;line-height:1.6;color:#111">
        <h1>Panel de control — InfiniHon Corp.</h1>
        <p>
          Panel administrativo interno de InfiniHon Corp., de acceso restringido al equipo del corporativo.
          Si buscas el sitio público, visita <a href="/">infinihon.vercel.app</a>.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
