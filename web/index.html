    <script>
      (function () {
        try {
          var t = localStorage.getItem("infinihon-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();

    <!-- Pantalla de carga: marcado y estilos propios (no dependen del bundle
         de React) para que aparezca de inmediato al recargar o entrar a la
         página, y para que cubra toda la carga real (fuentes + recursos)
         sin depender de que React ya haya montado. Ver el script al final
         de <body> para la lógica que la oculta. -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background: var(--color-obsidian, #05070a);
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-loader[data-hidden="true"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-loader img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        animation: app-loader-bob 1.4s ease-in-out infinite, app-loader-in 0.5s ease-out;
        filter: drop-shadow(0 18px 40px rgba(0, 102, 255, 0.55));
      }
      #app-loader .app-loader-label {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--color-snow, #f5f7fa);
      }
      #app-loader .app-loader-track {
        width: 200px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: color-mix(in srgb, var(--color-steel, #8b96a5) 30%, transparent);
      }
      #app-loader .app-loader-bar {
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: var(--color-tech, #0066ff);
        box-shadow: 0 0 14px 1px rgba(0, 102, 255, 0.75);
        animation: app-loader-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-loader-bob {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-14px) scale(1.04); }
      }
      @keyframes app-loader-in {
        from { opacity: 0; transform: translateY(10px) scale(0.85); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes app-loader-slide {
        0% { transform: translateX(-120%); }
        50% { transform: translateX(80%); }
        100% { transform: translateX(260%); }
      }
    </style>

    <div id="app-loader" role="status" aria-live="polite" aria-label="Cargando InfiniHon Corp.">
      <img src="./assets/mascot-hero.png" alt="" aria-hidden="true" />
      <div class="app-loader-track"><div class="app-loader-bar"></div></div>
      <span class="app-loader-label">INFINIHON CORP.</span>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var loader = document.getElementById("app-loader");
        if (!loader) return;
        var hidden = false;
        // Este sitio va en un solo archivo (todo el CSS/JS inlineado), así
        // que en una conexión normal termina de "cargar" casi al instante y
        // la pantalla de carga apenas alcanza a notarse. Por eso se fuerza
        // un mínimo visible (no alarga cargas lentas: si la página tarda más
        // que esto, igual se oculta apenas esté lista).
        var MIN_VISIBLE_MS = 900;
        var shownAt = Date.now();
        function hide() {
          if (hidden) return;
          hidden = true;
          var elapsed = Date.now() - shownAt;
          var wait = Math.max(0, MIN_VISIBLE_MS - elapsed);
          window.setTimeout(function () {
            loader.setAttribute("data-hidden", "true");
            window.setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 450);
          }, wait);
        }
        var fontsReady =
          document.fonts && document.fonts.ready ? document.fonts.ready.catch(function () {}) : Promise.resolve();
        var pageReady = new Promise(function (resolve) {
          if (document.readyState === "complete") resolve();
          else window.addEventListener("load", resolve, { once: true });
        });
        Promise.all([fontsReady, pageReady]).then(hide);
        // Red de seguridad: si una fuente o imagen tarda demasiado (o falla),
        // la pantalla de carga nunca debe quedar trabada indefinidamente.
        window.setTimeout(hide, 6000);
      })();
    </script>
