to antes de tocar el switch."},{h:"Paso 2 · Subinterfaces y trunking en el router",p:"El router (o firewall) termina cada VLAN en una subinterfaz y el switch la distribuye por un trunk 802.1Q. En MikroTik esto es un bridge con VLAN filtering — potente pero fino: un error en el bridge puede dejarte fuera de tu propio equipo. Hazlo con acceso físico cerca."},{h:"Paso 3 · Firewall entre VLANs: negar por defecto",p:"La segmentación sin control de tráfico es decoración. La política sana: desde usuarios se puede salir a Internet, pero no llegar a la VLAN de administración; invitados solo Internet; cámaras solo hablan con su NVR. Aclara cada regla y su razón — la documentación de hoy es el incidente evitado de mañana."},{h:"Paso 4 · DHCP y reglas de oro",p:"Un servidor DHCP por VLAN, rangos reservados documentados, y las impresoras/Equipos compartidos en la VLAN que menos duela si se caen. Y la regla de oro: cambia la VLAN de gestión a una no por defecto antes de exponer cualquier servicio."},{h:"Cómo sabemos que funcionó",p:"Prueba de la verdad: desde la VLAN de invitados intenta alcanzar la VLAN de administración. Debe fallar. Hazlo cada que cambies algo y anótalo. Si quieres que lo revisemos con ojos de ingeniero, el diagnóstico inicial es gratis."}],1:[{h:"La pregunta mal hecha",p:"«¿Cuál es más potente?» es la pregunta incorrecta. La correcta: ¿cuál falla de la forma menos dolorosa para MI carga? Un cluster de placas (K3s, Raspberry/mini-PCs) y un servidor tradicional resuelven problemas distintos con modos de falla opuestos."},{h:"Cluster de placas: donde brilla",p:"Aprendizaje (romper y rebuild en 20 minutos), servicios tolerantes a fallos (DNS, monitoreo, dashboards), y laboratorios de despliegue. Si un nodo muere, el servicio migra. El costo inicial es bajo y el consumo eléctrico, ridículo. Pero: almacenamiento distribuido es su punto débil, y el rendimiento por nodo individual es modesto."},{h:"Servidor tradicional: donde brilla",p:"Bases de datos reales, virtualización con almacenamiento local rápido (NVMe), cargas que puden memoria y RAM de una sola máquina. Un solo punto de falla — sí — pero con UPS, respaldos y hardware enterprise, esa falla es gestionable. El costo por vatio y por TB suele favorecerlo."},{h:"El patrón que recomendamos",p:"Híbrido honesto: un servidor pequeño serio para lo crítico (datos, dominio, respaldos) + cluster mini para servicios y experimentos. Lo mejor de ambos mundos sin hipotecar el presupuesto. Si tu caso puro es uno de los dos, te lo diremos — no vendemos el híbrido por inercia."}],2:[{h:"Antes de abrir un solo puerto",p:"Publicar un servicio a Internet es abrir la puerta de tu oficina a la calle entera. Este es el checklist que ejecutamos antes de cualquier exposición, aprendido a base de auditorías."},{h:"1 · Inventario del servicio",p:"¿Qué versión corre? ¿Qué puertos usa REALMENTE (no los que dice la documentación)? ¿Depende de algo interno (base de datos, Active Directory)? Un servicio expuesto sin conocer sus dependencias es un mapa del tesoro regalado."},{h:"2 · Actualización y hardening",p:"Parches al día, cuentas por defecto eliminadas, TLS con certificado válido (Let's Encrypt existe para eso), headers de seguridad configurados. Si el software no ha tenido actualización en 18 meses, piénsalo dos veces."},{h:"3 · Exposición mínima",p:"Regla de oro: nada se publica directo; todo pasa por el firewall con regla explícita origen→destino→puerto. Geobloqueo cuando el servicio es local. Autenticación en capa frontal (fail2ban, WAF básico) para servicios sensibles."},{h:"4 · Observabilidad antes de abrir",p:"Logs centralizados, alerta por intentos fallidos repetidos y un dashboard del servicio. El día que algo raro pasa, la diferencia entre «saber en 5 minutos» y «enterarse el viernes» es si hiciste esta parte."},{h:"5 · Plan de cierre",p:"¿Cómo se apaga esto en una emergencia? Una regla de firewall que deshabilita el acceso en 10 segundos, documentada y probada. El botón rojo se instala
